<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tallivalitsin – demo Näppärä-autotalleille</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2310231c%27/%3E%3Cpath d=%27M6 24V14L16 7l10 7v10M12 24v-7h8v7%27 fill=%27none%27 stroke=%27%23e2a55a%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
  /* Demon isäntäsivu: demopalkki ja tallivalitsin koko ikkunan kokoisena. Ei jäljittele Näppärän sivustoa. */
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;height:100dvh;background:#07130f;font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;overflow:hidden}
  .demopalkki{flex:none;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:3px 12px;background:#07130f;color:#b9c9c0;font-size:12px;line-height:1.3;min-height:28px;box-sizing:border-box}
  .demopalkki b{color:#fff;font-weight:600}
  .demopalkki label{margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .demopalkki select{font:inherit;color:#fff;background:#183a2d;border:1px solid #ffffff40;border-radius:6px;padding:1px 6px;min-height:22px}
  .demopalkki select:focus-visible{outline:2px solid #e2a55a;outline-offset:2px}
  nappara-tallivalitsin{flex:1;min-height:0;display:block}
  @media (max-width:719px){.demopalkki .pitka{display:none}.demopalkki{padding:3px 10px;flex-wrap:nowrap;font-size:11.5px}.demopalkki select{min-height:30px;max-width:150px}}
</style>
</head>
<body>
<div class="demopalkki" data-demopalkki>
  <span><b>Demo</b> – Sinoetic Oy:n malli<span class="pitka"> Näppärä-autotalleille · esimerkkihinnat · mitään ei lähetetä</span> · 18.11.2026</span>
  <label><span class="pitka">Hinnan näyttö</span>
    <select id="hinnan-naytto" aria-label="Hinnan näyttö">
      <option value="haarukka">Haarukka</option>
      <option value="tarkka">Tarkka arvio</option>
      <option value="piilossa">Vasta yhteystietojen jälkeen</option>
    </select>
  </label>
</div>
<nappara-tallivalitsin id="valitsin" mallit="esimerkki"></nappara-tallivalitsin>
<script src="nappara-tallivalitsin.js"></script>
<script>
  // Demon isäntäsivu: hinnan näyttötapa attribuutilla, ja tarjouspyyntö-tapahtuma vain konsoliin (mitään ei lähetetä).
  (function () {
    var v = document.getElementById('valitsin'), s = document.getElementById('hinnan-naytto');
    s.addEventListener('change', function () { v.setAttribute('hinta', s.value); });
    v.addEventListener('tarjouspyynto', function (e) { window.viimeisinTarjouspyynto = e.detail; console.info('tarjouspyynto', e.detail); });
  })();
</script>
</body>
</html>
